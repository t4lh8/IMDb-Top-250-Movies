name: Build site

on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC, IMDb updates its files daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "imdbtop/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download IMDb data and build the page
        run: python -m imdbtop --out site/IMDb_Top_250_Movies.xlsx --site site
      - name: Keep the Excel file out of the public site
        run: rm site/IMDb_Top_250_Movies.xlsx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
